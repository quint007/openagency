name: Newsletter maintenance

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-maintenance-production
  cancel-in-progress: false

jobs:
  maintain:
    name: Retry delivery and expire pending data
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      MAINTENANCE_URL: ${{ vars.NEWSLETTER_MAINTENANCE_URL != '' && vars.NEWSLETTER_MAINTENANCE_URL || 'https://admin.open-agency.io/api/newsletter/maintenance' }}
      CRON_SECRET: ${{ secrets.BACKEND_CRON_SECRET }}
    steps:
      - name: Run newsletter maintenance
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MAINTENANCE_URL"
