name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

concurrency:
  group: production-opentofu-state
  cancel-in-progress: false

env:
  AWS_MAX_ATTEMPTS: "10"
  AWS_RETRY_MODE: adaptive

jobs:
  plan-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu -chdir=infra/environments/production init
      - run: tofu -chdir=infra/environments/production plan
